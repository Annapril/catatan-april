<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lk=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>lk(Date.now());
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANGS=['Python','SQL','BigQuery','R','Bash','JSON','Teks'];
const COLORS=['#F4A3B0','#92A8D1','#FDE047','#86EFAC'];
const KWS={sql:'select from where group by order having limit offset join left right inner outer full cross on using as and or not in is null like between case when then else end distinct union all intersect except with over partition asc desc create replace table view insert into values update set delete drop alter if exists unnest struct array interval qualify true false rollup cube window range rows',
 Python:'def class return if elif else for while in not and or is import from as with try except finally raise lambda None True False pass break continue yield async await global nonlocal del assert',
 R:'function if else for while repeat break next in return TRUE FALSE NULL NA',
 Bash:'if then elif else fi for do done while until case esac in function echo cd export return',
 JSON:'true false null'};
Object.keys(KWS).forEach(k=>KWS[k]=new Set(KWS[k].split(' ')));
function hlCode(txt,lang){
 if(lang==='Teks')return esc(txt);
 const sql=lang==='SQL'||lang==='BigQuery',kw=KWS[sql?'sql':lang]||new Set();
 const com=lang==='JSON'?'(?!)':sql?/--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\//.source:/#[^\n]*/.source;
 const re=new RegExp([com,/'{3}[\s\S]*?'{3}|"{3}[\s\S]*?"{3}|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"/.source,/`[^`\n]*`/.source,/\b\d+(?:\.\d+)?\b/.source,/[A-Za-z_]\w*/.source].map(x=>'('+x+')').join('|'),'g');
 let out='',last=0,m;
 while((m=re.exec(txt))){
  out+=esc(txt.slice(last,m.index));last=re.lastIndex;
  const t=m[0];let c='';
  if(m[1])c='c';else if(m[2])c='s';else if(m[3])c='b';else if(m[4])c='n';
  else if(kw.has(sql?t.toLowerCase():t))c='k';
  else if(/^\s*\(/.test(txt.slice(last)))c='f';
  out+=c?`<span class="k-${c}">${esc(t)}</span>`:esc(t);
 }
 return out+esc(txt.slice(last));
}
const codeBody=(t,l)=>`<div class="cbody"><pre class="cl" aria-hidden="true">${hlCode(t,l)}</pre><pre class="ce" contenteditable="plaintext-only" spellcheck="false">${esc(t)}</pre></div>`;
function ceText(n){let o='';n.childNodes.forEach(c=>{if(c.nodeType===3)o+=c.nodeValue;else if(c.nodeName==='BR')o+='\n';else{const t=ceText(c);o+=t;if(/^(DIV|P)$/.test(c.nodeName)&&!t.endsWith('\n')&&c.nextSibling)o+='\n'}});return o}
function ceOff(ce,node,off){const r=document.createRange();r.selectNodeContents(ce);r.setEnd(node,off);const d=document.createElement('div');d.appendChild(r.cloneContents());return ceText(d).length}
function ceEdit(ce,ins){
 const s=getSelection();if(!s.rangeCount)return;
 const txt=ceText(ce),r=s.getRangeAt(0);
 const a=ceOff(ce,r.startContainer,r.startOffset),b=ceOff(ce,r.endContainer,r.endOffset);
 let nt=txt.slice(0,a)+ins+txt.slice(b);
 if(a+ins.length===nt.length&&ins.endsWith('\n'))nt+='\n';
 ce.textContent=nt;
 const rg=document.createRange(),tn=ce.firstChild;
 if(tn)rg.setStart(tn,Math.min(a+ins.length,tn.length));else rg.setStart(ce,0);
 rg.collapse(true);s.removeAllRanges();s.addRange(rg);
 ce.dispatchEvent(new Event('input',{bubbles:true}));
}
function upgradeCode(root){root.querySelectorAll('.code').forEach(c=>{
 const l=c.querySelector('select');c.dataset.l=l?l.value:'Teks';
 if(!c.querySelector('.cbody')){const o=c.querySelector('pre'),t=o?o.textContent:'';o&&o.remove();c.insertAdjacentHTML('beforeend',codeBody(t,c.dataset.l))}
 const ce=c.querySelector('.ce');
 if(ce){const t=ceText(ce);if(ce.children.length||ce.textContent!==t)ce.textContent=t;c.querySelector('.cl').innerHTML=hlCode(t,c.dataset.l)}
})}
const WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let db;
const S={projects:[],notes:[],pdfs:[],view:'dash',pid:null,nid:null,fid:null,zoom:1.3,tok:0,cp:0,cn:0};
try{const c=JSON.parse(localStorage.getItem('cb_cols')||'{}');S.cp=c.cp?1:0;S.cn=c.cn?1:0}catch{}
const ICO='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14M17 7l-5 5 5 5"/></svg>';
function applyCols(){const c=$('.cols');if(!c)return;c.classList.toggle('x1',!!S.cp);c.classList.toggle('x2',!!S.cn);try{localStorage.setItem('cb_cols',JSON.stringify({cp:S.cp,cn:S.cn}))}catch{}}

const openDB=()=>new Promise((ok,no)=>{const q=indexedDB.open('catatan-belajar',1);
 q.onupgradeneeded=()=>['projects','notes','pdfs'].forEach(n=>q.result.createObjectStore(n,{keyPath:'id'}));
 q.onsuccess=()=>{db=q.result;ok()};q.onerror=()=>no(q.error)});
const tx=(s,m,f)=>new Promise((ok,no)=>{const t=db.transaction(s,m);const o=f(t.objectStore(s));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)});
const getAll=s=>tx(s,'readonly',o=>o.getAll());
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const del=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
const curNote=()=>S.notes.find(x=>x.id===S.nid);
const curPdf=()=>S.pdfs.find(x=>x.id===S.fid);

function renderNav(){
 $('#nav').innerHTML='<span class="brand"><i class="logo"><svg viewBox="0 0 24 52" aria-hidden="true"><defs><radialGradient id="lsg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DCE8FA"/><stop offset="1" stop-color="#A9C0E8"/></radialGradient><linearGradient id="lsb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9BDE4"/><stop offset="1" stop-color="#5F7DB6"/></linearGradient><linearGradient id="lss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#D7DEEE"/><stop offset="1" stop-color="#AEB9D2"/></linearGradient><linearGradient id="lsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF1FF"/><stop offset=".45" stop-color="#F6DDE4"/><stop offset="1" stop-color="#F08BAB"/></linearGradient></defs><circle cx="12" cy="11" r="10" fill="url(#lsg)" stroke="#fff" stroke-opacity=".9" stroke-width=".8"/><path d="M12 17v-5M12 12c-3-1-5-3-4.5-5.5C9 5 11 5.5 12 7c1-1.500 3-2 4.500-.5.500 2.500-1.500 4.500-4.500 5.500z" fill="#6F8FCB" fill-opacity=".85"/><path d="M5 8c2-3 6-4.500 9-3.500M6 15c3 2.500 8 2.500 11 0" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8" stroke-linecap="round"/><rect x="3" y="20" width="18" height="4.500" rx="1.800" fill="url(#lsb)"/><rect x="4.500" y="20.700" width="15" height="1" rx=".5" fill="#fff" fill-opacity=".45"/><rect x="6.500" y="24.500" width="11" height="4" rx="1.200" fill="url(#lss)"/><rect x="8.500" y="28.500" width="7" height="19" rx="1.400" fill="url(#lsh)" stroke="#fff" stroke-opacity=".7" stroke-width=".5"/><path d="M8.700 32l3.300 2 3.300-2M8.700 36l3.300 2 3.300-2M8.700 40l3.300 2 3.300-2M8.700 44l3.300 2 3.300-2" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width=".6"/><rect x="9.600" y="29" width="1.200" height="18" rx=".6" fill="#fff" fill-opacity=".45"/><rect x="7" y="47" width="10" height="3.500" rx="1.400" fill="url(#lss)"/></svg></i>Catatan Belajar<em>.</em></span><nav class="menu">'+[['dash','Dashboard'],['notes','Catatan'],['know','Materi']].map(([v,l])=>`<button class="mn ${S.view===v?'on':''}" data-v="${v}">${l}</button>`).join('')+'</nav><span class="navr">'+new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})+'</span>';
}
function render(){
 renderNav();S.tok++;IMG=null;placeBox();
 const P=$('#page');
 if(S.view==='dash')P.innerHTML=dashHTML();
 else if(S.view==='notes'){P.innerHTML='<div class="cols'+(S.cp?' x1':'')+(S.cn?' x2':'')+'"><aside class="col p" id="cp"></aside><section class="col" id="cn"></section><main id="main"></main></div>';renderProj();renderList();renderEditor()}
 else{P.innerHTML='<div class="cols2"><section class="col" id="ck"></section><main id="kmain"></main></div>';renderKList();renderViewer()}
}

/* ---------- Dashboard ---------- */
function dashHTML(){
 const dates=new Set(S.notes.map(n=>n.date));
 let i=dates.has(today())?0:1,streak=0;
 while(dates.has(lk(Date.now()-i*864e5))){streak++;i++}
 const days=[...Array(14)].map((_,k)=>{const d=lk(Date.now()-(13-k)*864e5);return{d,c:S.notes.filter(n=>n.date===d).length}});
 const mx=Math.max(1,...days.map(x=>x.c));
 const code=S.notes.reduce((a,n)=>a+(n.html.match(/class="code"/g)||[]).length,0);
 const hls=S.pdfs.reduce((a,f)=>a+(f.hl||[]).length,0);
 const pm=Math.max(1,...S.projects.map(p=>S.notes.filter(n=>n.pid===p.id).length));
 const rec=[...S.notes].sort((a,b)=>b.updated-a.updated).slice(0,6);
 const pn=id=>S.projects.find(p=>p.id===id)?.name||'';
 return `<div class="dash"><section class="hero2">
 <div class="eyep">HALO, BELAJAR APA HARI INI?</div>
 <h1>Ubah catatan harian jadi <em>pengetahuan</em> yang terasa.</h1>
 <p>Catat yang dipelajari, simpan kueri dan syntax, lalu buka materi PDF di satu ruang belajar pribadi.</p>
 <div class="hb"><button class="cta2" data-v="know">Buka materi <i>▷</i></button><button class="cta" data-quick>Catatan hari ini <i>↗</i></button></div>
 <div class="stage"><svg class="lines" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M9 8 Q 28 10 40 34"/><path d="M13 46 Q 28 50 36 44"/><path d="M91 6 Q 72 8 62 32"/><path d="M87 44 Q 72 48 66 42"/></svg>
 <i class="orb o1">&lt;/&gt;</i><i class="orb o2">✎</i><i class="orb o3">▤</i><i class="orb o4">✦</i>
 <div class="console"><div class="ch"><span><b></b><b></b><b></b></span><small>AKTIVITAS 14 HARI</small><small>${fmt(today())}</small></div>
 <div class="bars">${days.map((x,k)=>`<div class="${k===13?'td':''}" title="${x.d}: ${x.c}"><i class="${x.c?'':'z'}" style="height:${x.c/mx*85}%"></i>${+x.d.slice(8)}</div>`).join('')}</div>
 <div class="cf"><div><small>Hari ini</small><b>${S.notes.filter(n=>n.date===today()).length} catatan</b></div><div><small>Beruntun</small><b>${streak} hari</b></div><div><small>Blok kode</small><b>${code}</b></div></div></div></div></section>
 <div class="eye2" style="margin-top:40px">RINGKASAN</div><h3 class="sec">Perjalanan belajarmu</h3>
 <div class="stats">${[['Beruntun',streak,'hari menulis','#F58AA8'],['Catatan',S.notes.length,'total','#92A8D1'],['Blok kode',code,'kueri & syntax','#C3A9E6'],['Materi',S.pdfs.length,'file PDF','#FFC09F'],['Highlight',hls,'di materi','#8FB4DD']].map(x=>`<div class="stat" style="--c:${x[3]}"><small>${x[0]}</small><b>${x[1]}</b><span class="mut">${x[2]}</span></div>`).join('')}</div>
 <div class="g2"><div class="card"><h3>Per project</h3>${S.projects.length?S.projects.map(p=>{const c=S.notes.filter(n=>n.pid===p.id).length;return `<div class="prow"><span><b>${esc(p.name)}</b><em class="mut" style="font-style:normal">${c}</em></span><u><i style="width:${c/pm*100}%"></i></u></div>`}).join(''):'<span class="mut">Belum ada project.</span>'}</div>
 <div class="card"><h3>Terakhir diubah</h3>${rec.length?rec.map(n=>`<button class="rec" data-open="${n.id}"><b>${esc(n.title||'Tanpa judul')}</b><span class="mut">${esc(pn(n.pid))} · ${n.date}</span></button>`).join(''):'<span class="mut">Belum ada catatan. Mulai dengan tombol di atas.</span>'}</div></div></div>`;
}

/* ---------- Catatan ---------- */
function renderProj(){
 const cp=$('#cp');cp.classList.toggle('cl',!!S.cp);
 if(S.cp){cp.innerHTML='<button class="cbtn ex" data-col="cp" title="Tampilkan panel project">'+ICO+'</button><span class="rl">Project</span>';return}
 cp.innerHTML='<div class="chd"><b>Project</b><button class="cbtn" data-col="cp" title="Sembunyikan panel project">'+ICO+'</button></div><div class="lst">'+S.projects.map(p=>`<button class="item ${p.id===S.pid?'on':''}" data-p="${p.id}"><div><b>${esc(p.name)}</b></div><span>${S.notes.filter(n=>n.pid===p.id).length}</span></button>`).join('')+'</div><button class="link" id="addP">+ Project baru</button>'+(S.pid?'<button class="link" id="delP" style="color:var(--mut);border-color:var(--line)">Hapus project</button>':'');
}
function renderList(){
 const c=$('#cn');c.classList.toggle('cl',!!S.cn);
 if(S.cn){c.innerHTML='<button class="cbtn ex" data-col="cn" title="Tampilkan panel catatan">'+ICO+'</button><span class="rl">Catatan</span>';return}
 if(!S.pid){c.innerHTML='<div class="bar" style="justify-content:flex-end"><button class="cbtn" data-col="cn" title="Sembunyikan panel catatan">'+ICO+'</button></div><p class="empty">Buat project dulu di kolom kiri, misalnya "Python" atau "SQL".</p>';return}
 const notes=S.notes.filter(n=>n.pid===S.pid).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated);
 c.innerHTML=`<div class="bar"><button class="btn full" id="addN">+ Catatan baru</button><button class="cbtn" data-col="cn" title="Sembunyikan panel catatan">${ICO}</button></div><div class="lst">${notes.length?notes.map(n=>`<button class="item ${n.id===S.nid?'on':''}" data-n="${n.id}"><div><b>${esc(n.title||'Tanpa judul')}</b><span>${fmt(n.date)}</span></div></button>`).join(''):'<p class="empty">Belum ada catatan di project ini.</p>'}</div>`;
}
function renderEditor(){
 const M=$('#main'),n=curNote();
 if(!n){M.innerHTML='<div class="empty">Pilih catatan atau buat catatan baru.</div>';return}
 M.innerHTML=`<div class="head"><input id="title" placeholder="Judul catatan" value="${esc(n.title)}"><input type="date" id="date" value="${n.date}"></div>
 <div class="head" style="padding-top:8px"><span class="status" id="st">Tersimpan</span><span style="flex:1"></span><button class="btn ghost" id="delN">Hapus</button><button class="btn" id="pdfN">Ekspor PDF</button></div>
 <div class="tb"><button class="cd" data-code title="Sisipkan kotak kode">{ } Kode</button>
  <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button>
  <button data-b="H2">H1</button><button data-b="H3">H2</button><button data-b="P">P</button>
  <button data-c="insertUnorderedList">•</button><button data-c="insertOrderedList">1.</button>
  <button data-b="BLOCKQUOTE" title="Blok kutipan">Kutipan</button><button data-h="1" title="Klik lagi untuk menghapus highlight">Highlight</button><button data-img>Gambar</button><input type="file" id="imgf" accept="image/*" multiple hidden><button data-c="undo">↶</button><button data-c="redo">↷</button></div>
 <div id="ed" class="doc" contenteditable="true" spellcheck="true">${n.html}</div>`;
 upgradeCode($('#ed'));
}
let timer;
function save(n){
 const st=$('#st');st&&(st.textContent='Menyimpan…');
 clearTimeout(timer);
 timer=setTimeout(async()=>{n.updated=Date.now();await put('notes',n);const s=$('#st');s&&(s.textContent='Tersimpan');if(S.view==='notes'){renderProj();renderList()}},500);
}
async function newNote(){
 if(!S.projects.length){const name=prompt('Nama project pertama (mis. Python, SQL):');if(!name||!name.trim())return;const p={id:uid(),name:name.trim(),created:Date.now()};await put('projects',p);S.projects.push(p);S.pid=p.id}
 if(!S.pid)S.pid=S.projects[0].id;
 const n={id:uid(),pid:S.pid,title:'',date:today(),html:'<p><br></p>',updated:Date.now()};
 await put('notes',n);S.notes.push(n);S.nid=n.id;S.view='notes';render();$('#title')?.focus();
}
function ensureCaret(){const ed=$('#ed'),s=getSelection();if(!ed.contains(s.anchorNode)){const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}ed.focus()}
function insertCode(){
 ensureCaret();
 document.execCommand('insertHTML',false,`<div class="code" contenteditable="false" data-l="Python"><div class="chead"><select>${LANGS.map(l=>`<option>${l}</option>`).join('')}</select><span style="flex:1"></span><button type="button" data-copy>Salin</button><button type="button" data-rmcode>Hapus</button></div>${codeBody('','Python').replace('class="ce"','class="ce" id="newcode"')}</div><p><br></p>`);
 const p=$('#newcode');if(p){p.removeAttribute('id');p.focus()}
}
function insertImage(f){
 const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  ensureCaret();
  document.execCommand('insertHTML',false,`<img src="${c.toDataURL(f.type==='image/jpeg'?'image/jpeg':'image/png',.92)}" style="width:60%"><p><br></p>`);
  const n=curNote();n.html=$('#ed').innerHTML;save(n)};im.src=r.result};
 r.readAsDataURL(f);
}
function autoList(e){
 if(e.inputType!=='insertText'||e.data!==' ')return;
 const ed=$('#ed'),s=getSelection();if(!s.rangeCount)return;
 let b=s.anchorNode;while(b&&b.parentNode!==ed)b=b.parentNode;
 if(!b||b.nodeType!==1||/^(OL|UL)$/.test(b.tagName)||b.classList.contains('code'))return;
 const m=b.textContent.replace(/\u00a0/g,' ').match(/^(1\.|[-*]) $/);if(!m)return;
 const l=document.createElement(m[1]==='1.'?'ol':'ul'),li=document.createElement('li');li.innerHTML='<br>';l.append(li);b.replaceWith(l);
 const r=document.createRange();r.setStart(li,0);r.collapse(true);s.removeAllRanges();s.addRange(r);
}
let IMG=null,CR=null;
function placeBox(){
 const b=$('#imgbox');
 if(!IMG||!IMG.isConnected||S.view!=='notes'){b.hidden=true;return}
 const r=IMG.getBoundingClientRect();
 Object.assign(b.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 b.classList.toggle('low',r.top<110);b.hidden=false;
}
document.addEventListener('scroll',placeBox,true);addEventListener('resize',placeBox);
$('#imgh').addEventListener('pointerdown',e=>{
 e.preventDefault();IMG.removeAttribute('width');IMG.removeAttribute('height');
 const w0=IMG.getBoundingClientRect().width,x0=e.clientX;
 const mv=ev=>{IMG.style.width=Math.max(40,w0+ev.clientX-x0)+'px';IMG.style.height='auto';placeBox()};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);const n=curNote();n.html=$('#ed').innerHTML;save(n)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
function openCrop(){$('#cimg').src=IMG.src;CR=null;$('#csel').style.display='none';$('#crop').hidden=false}
function closeCrop(){$('#crop').hidden=true;CR=null;setTimeout(placeBox,50)}
$('#crop .cw').addEventListener('pointerdown',e=>{
 e.preventDefault();
 const b=$('#cimg').getBoundingClientRect(),cl=(v,m)=>Math.min(m,Math.max(0,v)),x0=cl(e.clientX-b.left,b.width),y0=cl(e.clientY-b.top,b.height),s=$('#csel');
 const mv=ev=>{const x=cl(ev.clientX-b.left,b.width),y=cl(ev.clientY-b.top,b.height);CR={x:Math.min(x,x0),y:Math.min(y,y0),w:Math.abs(x-x0),h:Math.abs(y-y0)};Object.assign(s.style,{display:'block',left:CR.x+'px',top:CR.y+'px',width:CR.w+'px',height:CR.h+'px'})};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
function applyCrop(){
 const im=$('#cimg');
 if(CR&&CR.w>8&&CR.h>8){
  const k=im.naturalWidth/im.clientWidth,c=document.createElement('canvas');c.width=CR.w*k;c.height=CR.h*k;
  c.getContext('2d').drawImage(im,CR.x*k,CR.y*k,CR.w*k,CR.h*k,0,0,c.width,c.height);
  const shown=IMG.getBoundingClientRect().width,ratio=CR.w/im.clientWidth;
  IMG.src=c.toDataURL('image/png');IMG.style.width=Math.max(40,shown*ratio)+'px';IMG.style.height='auto';
  const n=curNote();n.html=$('#ed').innerHTML;save(n);
 }
 closeCrop();
}
function exportPDF(){
 const n=curNote(),p=S.projects.find(x=>x.id===S.pid);
 const w=document.createElement('div');w.innerHTML=$('#ed').innerHTML;
 w.querySelectorAll('.code').forEach(c=>{const l=c.querySelector('select');c.querySelector('.chead').innerHTML='<span>'+esc(l?l.value:'')+'</span>';c.querySelector('.ce')?.remove()});
 $('#print').innerHTML=`<div class="band"><div class="pj">${esc(p?p.name:'')}</div><h1>${esc(n.title||'Tanpa judul')}</h1><div class="dt">${fmt(n.date)}</div></div><div class="doc">${w.innerHTML}</div>`;
 const old=document.title;document.title=`${p?p.name:''} - ${n.title||'Catatan'} - ${n.date}`;
 window.onafterprint=()=>{document.title=old;window.onafterprint=null};
 window.print();
}

/* ---------- Knowledge ---------- */
function renderKList(){
 $('#ck').innerHTML=`<div class="bar"><button class="btn full" id="addF">+ Tambah PDF</button><input type="file" id="file" accept="application/pdf" multiple hidden></div><div class="lst">${S.pdfs.length?S.pdfs.map(f=>`<button class="item ${f.id===S.fid?'on':''}" data-f="${f.id}"><div><b>${esc(f.name)}</b><span>${(f.blob.size/1048576).toFixed(1)} MB · ${(f.hl||[]).length} highlight</span></div></button>`).join(''):'<p class="empty">Taruh PDF materi di sini untuk dibaca dan di-highlight.</p>'}</div>`;
}
function renderViewer(){
 const M=$('#kmain'),f=curPdf();
 if(!f){M.innerHTML='<div class="empty">Pilih materi dari daftar. Blok teks lalu pilih warna untuk highlight.</div>';return}
 M.innerHTML=`<div class="head" style="padding-bottom:10px"><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><span class="status" id="pginfo"></span><button class="btn ghost" data-z="-.2">−</button><button class="btn ghost" data-z=".2">+</button><button class="btn danger" id="delF">Hapus PDF</button></div><div id="pages"></div>`;
 openPdf();
}
let pdfDoc=null,obs=null;
async function openPdf(){
 const f=curPdf(),box=$('#pages');obs&&obs.disconnect();
 if(!window.pdfjsLib){
  box.innerHTML=`<iframe src="${URL.createObjectURL(f.blob)}" style="width:100%;height:100%;border:0;background:#fff" title="${esc(f.name)}"></iframe>`;
  $('#pginfo').textContent='Mode dasar (highlight butuh internet)';return}
 pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;
 const tok=++S.tok;
 try{
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.blob.arrayBuffer())}).promise;
  if(tok!==S.tok)return;pdfDoc=doc;
  const v=(await doc.getPage(1)).getViewport({scale:S.zoom});
  obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;drawPage(e.target,tok)}}),{root:box,rootMargin:'700px'});
  for(let i=1;i<=doc.numPages;i++){const d=document.createElement('div');d.className='page';d.dataset.n=i;d.style.width=v.width+'px';d.style.height=v.height+'px';box.appendChild(d);obs.observe(d)}
  $('#pginfo').textContent=doc.numPages+' halaman';
 }catch(err){box.innerHTML='<p class="empty">PDF tidak bisa dibuka: '+esc(err.message)+'</p>'}
}
async function drawPage(d,tok){
 const pg=await pdfDoc.getPage(+d.dataset.n);if(tok!==S.tok)return;
 const vp=pg.getViewport({scale:S.zoom}),dpr=window.devicePixelRatio||1;
 d.style.width=vp.width+'px';d.style.height=vp.height+'px';
 const c=document.createElement('canvas');c.width=vp.width*dpr;c.height=vp.height*dpr;c.style.width=vp.width+'px';c.style.height=vp.height+'px';
 const hl=document.createElement('div');hl.className='hl';
 const tl=document.createElement('div');tl.className='textLayer';tl.style.setProperty('--scale-factor',vp.scale);
 d.append(c,hl,tl);drawHl(d);
 await pg.render({canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
 pdfjsLib.renderTextLayer({textContentSource:await pg.getTextContent(),container:tl,viewport:vp,textDivs:[]});
}
function drawHl(d){
 const h=d.querySelector('.hl');if(!h)return;
 h.innerHTML=(curPdf().hl||[]).filter(x=>x.p==+d.dataset.n).map(x=>x.r.map(r=>`<i style="left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%;background:${x.c}"></i>`).join('')).join('');
}
const pageOf=n=>n&&(n.nodeType===3?n.parentElement:n).closest?.('.page');
$('#hlbar').innerHTML=COLORS.map(c=>`<button class="c" data-hc="${c}" style="background:${c}" title="Highlight"></button>`).join('')+'<button class="rm" data-rmhl title="Hapus highlight pada teks yang diblok">Hapus</button>';
document.addEventListener('mouseup',()=>setTimeout(()=>{
 const s=getSelection(),b=$('#hlbar');
 if(S.view!=='know'||s.isCollapsed||!pageOf(s.anchorNode)){b.hidden=true;return}
 const r=s.getRangeAt(0).getBoundingClientRect();
 b.style.left=Math.max(8,r.left+r.width/2-60)+'px';b.style.top=Math.max(62,r.top-42)+'px';b.hidden=false;
},0));
async function addHl(color){
 const s=getSelection(),pg=pageOf(s.anchorNode);if(!pg)return;
 const pr=pg.getBoundingClientRect();
 const r=[...s.getRangeAt(0).getClientRects()].filter(q=>q.width>1&&q.height>1&&q.right>pr.left&&q.left<pr.right&&q.bottom>pr.top&&q.top<pr.bottom)
  .map(q=>[(q.left-pr.left)/pr.width,(q.top-pr.top)/pr.height,q.width/pr.width,q.height/pr.height]);
 if(!r.length)return;
 const f=curPdf();(f.hl=f.hl||[]).push({p:+pg.dataset.n,c:color,r});
 await put('pdfs',f);s.removeAllRanges();$('#hlbar').hidden=true;drawHl(pg);renderKList();
}

async function removeHl(){
 const s=getSelection(),pg=pageOf(s.anchorNode);if(!pg)return;
 const pr=pg.getBoundingClientRect(),sel=[...s.getRangeAt(0).getClientRects()].map(q=>[(q.left-pr.left)/pr.width,(q.top-pr.top)/pr.height,q.width/pr.width,q.height/pr.height]);
 const f=curPdf(),n=+pg.dataset.n;
 const inside=r=>{const cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;return sel.some(q=>cx>=q[0]&&cx<=q[0]+q[2]&&cy>=q[1]&&cy<=q[1]+q[3])};
 f.hl=(f.hl||[]).filter(h=>!(h.p===n&&h.r.some(inside)));
 await put('pdfs',f);s.removeAllRanges();$('#hlbar').hidden=true;drawHl(pg);renderKList();
}
/* ---------- Events ---------- */
document.addEventListener('click',async e=>{
 if(e.target.closest('#ed img')){IMG=e.target;placeBox();return}
 if(IMG&&!e.target.closest('#imgbox,#crop')){IMG=null;placeBox()}
 const pgc=e.target.closest('.page');
 if(pgc&&getSelection().isCollapsed){
  const b=pgc.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height,f=curPdf();
  const i=(f.hl||[]).findIndex(h=>h.p==+pgc.dataset.n&&h.r.some(r=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]));
  if(i>-1&&confirm('Hapus highlight ini?')){f.hl.splice(i,1);await put('pdfs',f);drawHl(pgc);renderKList()}
  return}
 const t=e.target.closest('button');if(!t)return;
 const d=t.dataset;
 if(d.col){S[d.col]=S[d.col]?0:1;applyCols();return d.col==='cp'?renderProj():renderList()}
 if(d.v){S.view=d.v;return render()}
 if(d.quick!==undefined)return newNote();
 if(d.open){const n=S.notes.find(x=>x.id===d.open);S.pid=n.pid;S.nid=n.id;S.view='notes';return render()}
 if(d.hc)return addHl(d.hc);
 if(d.rmhl!==undefined)return removeHl();
 if(d.iw){IMG.removeAttribute('width');IMG.removeAttribute('height');IMG.style.width=d.iw+'%';IMG.style.height='auto';placeBox();const n=curNote();n.html=$('#ed').innerHTML;return save(n)}
 if(d.imgdel!==undefined){IMG.remove();IMG=null;placeBox();const n=curNote();n.html=$('#ed').innerHTML;return save(n)}
 if(d.crop!==undefined)return openCrop();
 if(d.cx!==undefined)return closeCrop();
 if(d.ca!==undefined)return applyCrop();
 if(d.z){S.zoom=Math.min(2.6,Math.max(.8,S.zoom+ +d.z));return openPdf2()}
 if(d.copy!==undefined){const txt=t.closest('.code').querySelector('pre').innerText;
  try{await navigator.clipboard.writeText(txt)}catch{const a=document.createElement('textarea');a.value=txt;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
  t.textContent='Tersalin';setTimeout(()=>t.textContent='Salin',1200);return}
 if(d.rmcode!==undefined){t.closest('.code').remove();const n=curNote();n.html=$('#ed').innerHTML;return save(n)}
 if(d.p){S.pid=d.p;S.nid=null;return render()}
 if(t.id==='addP'){
  const name=prompt('Nama project (mis. Python, SQL, Statistik):');if(!name||!name.trim())return;
  const p={id:uid(),name:name.trim(),created:Date.now()};await put('projects',p);S.projects.push(p);S.pid=p.id;S.nid=null;return render()}
 if(t.id==='delP'){
  if(!confirm('Hapus project ini beserta semua catatannya?'))return;
  const id=S.pid;for(const n of S.notes.filter(x=>x.pid===id))await del('notes',n.id);
  await del('projects',id);S.notes=S.notes.filter(x=>x.pid!==id);S.projects=S.projects.filter(x=>x.id!==id);
  S.pid=S.projects[0]?.id||null;S.nid=null;return render()}
 if(t.id==='addN')return newNote();
 if(d.n){S.nid=d.n;return render()}
 if(t.id==='delN'){if(!confirm('Hapus catatan ini?'))return;await del('notes',S.nid);S.notes=S.notes.filter(x=>x.id!==S.nid);S.nid=null;return render()}
 if(t.id==='pdfN')return exportPDF();
 if(t.id==='addF')return $('#file').click();
 if(d.f){S.fid=d.f;return render()}
 if(t.id==='delF'){if(!confirm('Hapus PDF ini?'))return;await del('pdfs',S.fid);S.pdfs=S.pdfs.filter(x=>x.id!==S.fid);S.fid=null;return render()}
 if(t.closest('.tb')){
  const ed=$('#ed');if(!ed.contains(document.activeElement))ed.focus();
  if(d.code!==undefined)insertCode();
  if(d.c)document.execCommand(d.c);
  if(d.b)document.execCommand('formatBlock',false,d.b);
  if(d.img!==undefined){$('#imgf').click();return}
  if(d.h){const v=document.queryCommandValue('hiliteColor')||document.queryCommandValue('backColor');document.execCommand('hiliteColor',false,/253,\s*230,\s*138|fde68a/i.test(v)?'transparent':'#fde68a')}
  const n=curNote();n.html=ed.innerHTML;save(n)}
});
function openPdf2(){const sc=$('#pages');const r=sc.scrollTop/Math.max(1,sc.scrollHeight);sc.innerHTML='';S.tok++;openPdf().then(()=>{sc.scrollTop=r*sc.scrollHeight})}
document.addEventListener('mousedown',e=>{if(e.target.closest('.tb button,#hlbar button,#imgbar button'))e.preventDefault()});
document.addEventListener('input',e=>{
 const ce=e.target.closest?.('.ce');
 if(ce){const c=ce.closest('.code');c.querySelector('.cl').innerHTML=hlCode(ceText(ce),c.dataset.l)}
 const n=curNote();if(!n||S.view!=='notes')return;
 if(e.target.id==='title'){n.title=e.target.value;save(n)}
 else if(e.target.closest('#ed')){IMG=null;placeBox();autoList(e);n.html=$('#ed').innerHTML;save(n)}
});
document.addEventListener('keydown',e=>{
 const ce=e.target.closest?.('.ce');
 if(!ce){
  if(e.key==='Tab'&&e.target.closest?.('#ed')){
   const a=getSelection().anchorNode,li=a&&(a.nodeType===3?a.parentElement:a).closest('li');
   if(li){e.preventDefault();document.execCommand(e.shiftKey?'outdent':'indent');const n=curNote();n.html=$('#ed').innerHTML;save(n)}}
  return}
 if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}
 else if(e.key==='Enter'&&!e.isComposing){e.preventDefault();ceEdit(ce,'\n')}
});
document.addEventListener('paste',e=>{
 const cd=e.clipboardData;
 if(e.target.closest?.('.ce')){e.preventDefault();ceEdit(e.target.closest('.ce'),cd.getData('text/plain').replace(/\r\n?/g,'\n'));return}
 const im=e.target.closest?.('#ed')?[...cd.files].filter(f=>f.type.startsWith('image/')):[];
 if(im.length){e.preventDefault();im.forEach(insertImage)}
});
document.addEventListener('change',async e=>{
 const n=curNote(),t=e.target;
 if(t.id==='date'&&n){n.date=t.value||today();save(n)}
 if(t.matches?.('.chead select')){[...t.options].forEach(o=>o.toggleAttribute('selected',o.selected));const c=t.closest('.code');c.dataset.l=t.value;c.querySelector('.cl').innerHTML=hlCode(ceText(c.querySelector('.ce')),t.value);n.html=$('#ed').innerHTML;save(n)}
 if(t.id==='imgf'){for(const f of t.files)insertImage(f);t.value=''}
 if(t.id==='file'){
  for(const f of t.files){if(f.type!=='application/pdf')continue;
   const r={id:uid(),name:f.name,blob:f,hl:[],added:Date.now()};await put('pdfs',r);S.pdfs.push(r);S.fid=r.id}
  render()}
});

(async()=>{
 await openDB();
 [S.projects,S.notes,S.pdfs]=await Promise.all([getAll('projects'),getAll('notes'),getAll('pdfs')]);
 S.projects.sort((a,b)=>a.created-b.created);
 S.pid=S.projects[0]?.id||null;
 render();
})();
</script>
